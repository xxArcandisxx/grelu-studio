{% macro user_avatar(researcher, large=false) -%}
<span class="avatar{% if large %} profile-avatar{% endif %}" aria-hidden="true">{% if researcher and researcher.has_avatar %}<img src="{{ url_for('accounts.avatar', user_id=researcher.id) }}" alt="">{% else %}{{ researcher.name[0]|upper if researcher else 'G' }}{% endif %}</span>
{%- endmacro %}
