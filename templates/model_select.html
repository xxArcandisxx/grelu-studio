<label for="model">Model</label>
<select id="model" name="model" aria-describedby="model-help">
<optgroup label="Local inference">
{% for key, label in choices.local.items() %}<option value="{{ key }}"{% if key == selected %} selected{% endif %}>{{ label }}</option>{% endfor %}
</optgroup>
<optgroup label="gReLU Model Zoo · catalog only">
{% for key in choices.zoo %}<option value="{{ key }}"{% if key == selected %} selected{% endif %}>{{ key }}</option>{% endfor %}
</optgroup>
</select>
<p class="model-help" id="model-help">Catalog selections use {{ choices.actual_label }} locally with a {{ "{:,}".format(choices.actual_length) }} bp input window.</p>
